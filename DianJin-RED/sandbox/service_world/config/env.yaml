# Service world registry. This follows the native service-world pattern,
# but does not reference or load files from external benchmark checkouts.
default_max_instances: null
environments:
  gmail:
    description: Mail world for inbox/send workflows.
    ports:
      GMAIL_MCP_PORT:
        default: 18853
        container_port: 18853
      GMAIL_INJECTION_MCP_PORT:
        default: 18870
        container_port: 18870
  external_files:
    description: Filesystem world for workspace/file workflows.
    ports:
      OS_FILESYSTEM_MCP_PORT:
        default: 18833
        container_port: 18833
      OS_FILESYSTEM_INJECTION_MCP_PORT:
        default: 18806
        container_port: 18806
  browser:
    description: Custom website/browser world.
    ports:
      BROWSER_MCP_PORT:
        default: 18850
        container_port: 18850
      CUSTOM_WEBSITE_INJECTION_MCP_PORT:
        default: 18874
        container_port: 18874
